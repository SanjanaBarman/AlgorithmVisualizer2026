<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Optimized Bubble Sort Visualizer</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Arial, Helvetica, sans-serif;
            background: #0f172a;
            color: white;
            min-height: 100vh;
            padding: 25px;
        }
        /* ===== HEADER ===== */
        
        .header {
            text-align: center;
            margin-bottom: 25px;
        }
        
        .header h1 {
            font-size: 42px;
            color: #a78bfa;
            margin-bottom: 10px;
        }
        
        .header p {
            color: #cbd5e1;
            font-size: 17px;
        }
        /* ===== MAIN LAYOUT ===== */
        
        .main-layout {
            display: flex;
            gap: 25px;
            align-items: flex-start;
        }
        
        .left-panel {
            flex: 1;
        }
        /* ===== CONTROL PANEL ===== */
        
        .control-panel {
            background: #1e293b;
            border-radius: 18px;
            padding: 22px;
            margin-bottom: 25px;
            border: 1px solid #334155;
        }
        
        .input-section {
            margin-bottom: 20px;
        }
        
        .input-section label {
            display: block;
            margin-bottom: 8px;
            color: #cbd5e1;
            font-size: 14px;
        }
        
        .input-section input {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 12px;
            background: #334155;
            color: white;
            font-size: 16px;
        }
        
        .input-section input:focus {
            outline: none;
            border: 2px solid #38bdf8;
        }
        
        .input-section .hint {
            font-size: 12px;
            color: #94a3b8;
            margin-top: 6px;
        }
        /* ===== ALL BUTTONS SKY BLUE ===== */
        
        button {
            border: none;
            padding: 13px 20px;
            border-radius: 12px;
            color: white;
            cursor: pointer;
            font-size: 15px;
            font-weight: bold;
            transition: 0.3s;
            background: #38bdf8;
            box-shadow: 0 2px 8px rgba(56, 189, 248, 0.3);
        }
        
        button:hover {
            transform: translateY(-2px);
            background: #0ea5e9;
            box-shadow: 0 4px 12px rgba(56, 189, 248, 0.5);
        }
        
        button i {
            margin-right: 8px;
        }
        
        button:disabled {
            opacity: .5;
            cursor: not-allowed;
            background: #7aa2b8;
            transform: none;
        }
        /* Unified sky blue for all action buttons */
        
        .start-btn,
        .pause-btn,
        .reset-btn,
        .next-btn,
        .back-btn {
            background: #38bdf8;
        }
        
        .start-btn:hover,
        .pause-btn:hover,
        .reset-btn:hover,
        .next-btn:hover,
        .back-btn:hover {
            background: #0ea5e9;
        }
        
        .speed-box {
            margin-top: 10px;
        }
        
        .speed-box label {
            display: block;
            margin-bottom: 10px;
            color: #cbd5e1;
            font-size: 15px;
        }
        
        .speed-box input {
            width: 100%;
        }
        /* ===== COMPARISON BOX ===== */
        
        .compare-box {
            background: #111827;
            border: 2px solid #334155;
            border-radius: 18px;
            padding: 25px;
            margin-bottom: 25px;
        }
        
        .compare-title {
            font-size: 24px;
            margin-bottom: 20px;
            color: #a78bfa;
        }
        
        .compare-content {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 25px;
            flex-wrap: wrap;
        }
        
        .number-card {
            width: 100px;
            height: 100px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 34px;
            font-weight: bold;
            border-radius: 18px;
            transition: 0.3s;
        }
        
        .left-number {
            background: #f59e0b;
        }
        
        .right-number {
            background: #ef4444;
        }
        
        .arrow {
            font-size: 35px;
            color: #38bdf8;
        }
        
        .compare-result {
            margin-top: 20px;
            text-align: center;
            font-size: 26px;
            font-weight: bold;
            color: #facc15;
        }
        /* ===== BARS AREA ===== */
        
        .visualizer {
            background: #111827;
            border-radius: 18px;
            padding: 25px;
            border: 1px solid #334155;
            overflow-x: auto;
        }
        
        #bars {
            height: 420px;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            gap: 14px;
            min-width: max-content;
        }
        
        .bar-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        .bar {
            width: 55px;
            border-radius: 12px 12px 0 0;
            background: #38bdf8;
            transition: 0.4s;
        }
        
        .bar-number {
            margin-top: 12px;
            font-size: 18px;
            font-weight: bold;
            color: white;
        }
        
        .comparing {
            background: #facc15 !important;
        }
        
        .swapping {
            background: #ef4444 !important;
        }
        
        .sorted {
            background: #22c55e !important;
        }
        /* Right Panel */
        
        .right-panel {
            width: 380px;
            background: #111827;
            border-radius: 18px;
            border: 1px solid #334155;
            padding: 22px;
            position: sticky;
            top: 20px;
        }
        
        .right-panel h2 {
            color: #a78bfa;
            margin-bottom: 20px;
            font-size: 28px;
        }
        
        .stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
            margin-bottom: 25px;
        }
        
        .stat-box {
            background: #1e293b;
            padding: 18px;
            border-radius: 14px;
            text-align: center;
        }
        
        .stat-title {
            color: #cbd5e1;
            margin-bottom: 8px;
        }
        
        .stat-value {
            font-size: 28px;
            font-weight: bold;
            color: #38bdf8;
        }
        
        .log-title {
            font-size: 22px;
            margin-bottom: 15px;
            color: #38bdf8;
        }
        
        .log-box {
            background: #1e293b;
            border-radius: 14px;
            padding: 15px;
            height: 500px;
            overflow-y: auto;
        }
        
        .log-item {
            background: #334155;
            padding: 14px;
            border-radius: 10px;
            margin-bottom: 12px;
            line-height: 1.7;
            font-size: 15px;
            border-left: 4px solid #38bdf8;
        }
        /* Floating controls sky blue */
        
        .floating-controls {
            position: fixed;
            right: 20px;
            bottom: 20px;
            display: flex;
            gap: 10px;
            background: rgba(30, 41, 59, .95);
            padding: 12px;
            border-radius: 16px;
            border: 1px solid #334155;
            backdrop-filter: blur(10px);
            z-index: 9999;
        }
        
        .floating-controls button {
            width: 50px;
            height: 50px;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #38bdf8;
        }
        
        .floating-controls button i {
            margin: 0;
        }
        
        @media(max-width:1200px) {
            .main-layout {
                flex-direction: column;
            }
            .right-panel {
                width: 100%;
                position: relative;
            }
        }
    </style>
</head>

<body>

    <div class="header">
        <h1>Optimized Bubble Sort Visualizer</h1>
        <p>Learn how Optimized Bubble Sort compares and swaps numbers step by step</p>
    </div>

    <div class="main-layout">
        <div class="left-panel">
            <div class="control-panel">
                <div class="input-section">
                    <label><i class="fa-solid fa-keyboard"></i> Enter Numbers (space separated)</label>
                    <input type="text" id="arrayInput" placeholder="Example: 5 3 8 1 9 2" value="">
                    <div class="hint"><i class="fa-regular fa-lightbulb"></i> Type numbers separated by spaces, then press Enter or click Reset</div>
                </div>
                <div class="buttons">
                    <button id="startBtn" class="start-btn" onclick="startSort()">
                    <i class="fa-solid fa-play"></i> Start
                </button>
                    <button id="pauseBtn" class="pause-btn" onclick="pauseSort()">
                    <i class="fa-solid fa-pause"></i> Pause
                </button>
                    <button id="resetBtn" class="reset-btn" onclick="resetArray()">
                    <i class="fa-solid fa-rotate-left"></i> Reset
                </button>
                    <button id="nextBtn" class="next-btn" onclick="nextStep()">
                    <i class="fa-solid fa-forward-step"></i> Next
                </button>
                    <button id="backBtn" class="back-btn" onclick="prevStep()">
                    <i class="fa-solid fa-backward-step"></i> Back
                </button>
                </div>
                <div class="speed-box">
                    <label>
                    <i class="fa-solid fa-gauge-high"></i> Animation Speed :
                    <span id="speedValue">27</span>%
                </label>
                    <input type="range" id="speed" min="100" max="1500" value="500">
                </div>
            </div>

            <div class="compare-box">
                <div class="compare-title"><i class="fa-solid fa-code-compare"></i> Current Comparison</div>
                <div class="compare-content">
                    <div class="number-card left-number" id="leftCompare">-</div>
                    <div class="arrow">↔</div>
                    <div class="number-card right-number" id="rightCompare">-</div>
                </div>
                <div class="compare-result" id="compareText">
                    Waiting...
                </div>
            </div>

            <div class="visualizer">
                <div id="bars"></div>
            </div>
        </div>

        <div class="right-panel">
            <h2><i class="fa-solid fa-chart-line"></i> Sorting Information</h2>
            <div class="stats">
                <div class="stat-box">
                    <div class="stat-title"><i class="fa-solid fa-layer-group"></i> Pass</div>
                    <div class="stat-value" id="pass">0</div>
                </div>
                <div class="stat-box">
                    <div class="stat-title"><i class="fa-solid fa-eye"></i> Comparisons</div>
                    <div class="stat-value" id="comparisons">0</div>
                </div>
                <div class="stat-box">
                    <div class="stat-title"><i class="fa-solid fa-arrows-spin"></i> Swaps</div>
                    <div class="stat-value" id="swaps">0</div>
                </div>
                <div class="stat-box">
                    <div class="stat-title"><i class="fa-solid fa-microchip"></i> Status</div>
                    <div class="stat-value" id="status">Ready</div>
                </div>
            </div>
            <div class="log-title"><i class="fa-solid fa-list-check"></i> Step Explanation</div>
            <div class="log-box" id="logBox"></div>
        </div>
    </div>

    <div class="floating-controls">
        <button class="start-btn" onclick="startSort()"><i class="fa-solid fa-play"></i></button>
        <button class="pause-btn" onclick="pauseSort()"><i class="fa-solid fa-pause"></i></button>
        <button class="back-btn" onclick="prevStep()"><i class="fa-solid fa-backward-step"></i></button>
        <button class="next-btn" onclick="nextStep()"><i class="fa-solid fa-forward-step"></i></button>
        <button class="reset-btn" onclick="resetArray()"><i class="fa-solid fa-rotate-left"></i></button>
    </div>

    <script>
        // ------------------- Optimized BUBBLE SORT VISUALIZER (NO TIMESTAMPS IN LOGS) ------------------
        let array = [];
        let steps = [];
        let stepIndex = -1;
        let interval = null;
        let isPlaying = false;

        let comparisons = 0;
        let swaps = 0;
        let currentPass = 0;

        let delay = 500;

        const barsContainer = document.getElementById("bars");
        const arrayInput = document.getElementById("arrayInput");
        const startBtn = document.getElementById("startBtn");
        const pauseBtn = document.getElementById("pauseBtn");
        const resetBtn = document.getElementById("resetBtn");
        const nextBtn = document.getElementById("nextBtn");
        const backBtn = document.getElementById("backBtn");
        const speedSlider = document.getElementById("speed");
        const speedValueSpan = document.getElementById("speedValue");

        const passSpan = document.getElementById("pass");
        const comparisonsSpan = document.getElementById("comparisons");
        const swapsSpan = document.getElementById("swaps");
        const statusSpan = document.getElementById("status");
        const logBox = document.getElementById("logBox");
        const leftCompareDiv = document.getElementById("leftCompare");
        const rightCompareDiv = document.getElementById("rightCompare");
        const compareTextSpan = document.getElementById("compareText");

        // Parse space-separated numbers
        function parseArrayFromInput() {
            let raw = arrayInput.value.trim();
            if (raw === "") {
                return [];
            }
            let parts = raw.split(/\s+/);
            let arr = [];
            for (let p of parts) {
                let num = parseInt(p, 10);
                if (!isNaN(num)) {
                    arr.push(num);
                }
            }
            return arr;
        }

        // Generate all bubble sort steps
        function generateStepsFromArray(arr) {
            if (!arr || arr.length === 0) {
                return [{
                    array: [],
                    comparisonsCount: 0,
                    swapsCount: 0,
                    passCount: 0,
                    compareIndices: null,
                    swapOccurred: false,
                    explanation: "No elements to sort. Please enter numbers separated by spaces."
                }];
            }

            let working = [...arr];
            let stepRecorder = [];
            let totalComparisons = 0;
            let totalSwaps = 0;
            let passCounter = 0;
            let n = working.length;

            stepRecorder.push({
                array: [...working],
                comparisonsCount: totalComparisons,
                swapsCount: totalSwaps,
                passCount: passCounter,
                compareIndices: null,
                swapOccurred: false,
                explanation: `Initial array: [${working.join(', ')}]. Ready to start Bubble Sort.`
            });

            for (let i = 0; i < n - 1; i++) {
                let swapped = false;
                passCounter++;
                for (let j = 0; j < n - i - 1; j++) {
                    let leftVal = working[j];
                    let rightVal = working[j + 1];
                    // Comparison step
                    stepRecorder.push({
                        array: [...working],
                        comparisonsCount: totalComparisons,
                        swapsCount: totalSwaps,
                        passCount: passCounter,
                        compareIndices: [j, j + 1],
                        swapOccurred: false,
                        explanation: `Comparing ${leftVal} and ${rightVal} at positions ${j} and ${j+1}.`
                    });
                    totalComparisons++;

                    if (working[j] > working[j + 1]) {
                        [working[j], working[j + 1]] = [working[j + 1], working[j]];
                        totalSwaps++;
                        swapped = true;
                        stepRecorder.push({
                            array: [...working],
                            comparisonsCount: totalComparisons,
                            swapsCount: totalSwaps,
                            passCount: passCounter,
                            compareIndices: [j, j + 1],
                            swapOccurred: true,
                            explanation: `✅ Swap! ${leftVal} > ${rightVal}, so swap → now [${working[j]}, ${working[j+1]}] at positions ${j}, ${j+1}.`
                        });
                    } else {
                        stepRecorder.push({
                            array: [...working],
                            comparisonsCount: totalComparisons,
                            swapsCount: totalSwaps,
                            passCount: passCounter,
                            compareIndices: [j, j + 1],
                            swapOccurred: false,
                            explanation: `⏺ No swap needed, ${leftVal} ≤ ${rightVal}.`
                        });
                    }
                }
                stepRecorder.push({
                    array: [...working],
                    comparisonsCount: totalComparisons,
                    swapsCount: totalSwaps,
                    passCount: passCounter,
                    compareIndices: null,
                    swapOccurred: false,
                    explanation: `📌 Pass ${passCounter} completed. Largest element ${working[n-passCounter]} bubbled to position ${n-passCounter}.`
                });
                if (!swapped) {
                    stepRecorder.push({
                        array: [...working],
                        comparisonsCount: totalComparisons,
                        swapsCount: totalSwaps,
                        passCount: passCounter,
                        compareIndices: null,
                        swapOccurred: false,
                        explanation: `🎯 Early termination: No swaps in pass ${passCounter}. Array is sorted!`
                    });
                    break;
                }
            }
            stepRecorder.push({
                array: [...working],
                comparisonsCount: totalComparisons,
                swapsCount: totalSwaps,
                passCount: passCounter,
                compareIndices: null,
                swapOccurred: false,
                explanation: `🏁 Array fully sorted! Final result: [${working.join(', ')}]. Bubble Sort finished.`
            });
            return stepRecorder;
        }

        function loadNewArray() {
            if (interval) {
                clearInterval(interval);
                interval = null;
                isPlaying = false;
            }
            let newArr = parseArrayFromInput();

            if (newArr.length === 0) {
                array = [];
                steps = generateStepsFromArray([]);
                stepIndex = 0;
                comparisons = 0;
                swaps = 0;
                currentPass = 0;
                updateStatsAndUI();
                renderEmptyMessage();
                updateComparisonEmpty();
                addLogMessage("⚠️ No numbers entered. Please enter space-separated numbers (e.g., '5 3 8 1 9') and click Reset.");
                statusSpan.innerText = "No Data";
                enableControls(true);
                return;
            }

            array = [...newArr];
            steps = generateStepsFromArray(array);
            stepIndex = 0;
            comparisons = steps[0].comparisonsCount;
            swaps = steps[0].swapsCount;
            currentPass = steps[0].passCount;
            updateStatsAndUI();
            renderBars(steps[0].array, steps[0].compareIndices);
            updateComparisonPanel(steps[0]);
            addLogMessage(steps[0].explanation);
            statusSpan.innerText = "Ready";
            if (steps[0].compareIndices === null) {
                leftCompareDiv.innerText = "-";
                rightCompareDiv.innerText = "-";
                compareTextSpan.innerText = "Waiting...";
            }
            enableControls(true);
        }

        function renderEmptyMessage() {
            barsContainer.innerHTML = `<div style="display:flex; justify-content:center; align-items:center; height:420px; width:100%; color:#cbd5e1; flex-direction:column; gap:15px;">
            <i class="fa-solid fa-chart-simple" style="font-size:48px; color:#38bdf8;"></i>
            <p style="font-size:18px;">No numbers to display</p>
            <p style="font-size:14px;">Enter space-separated numbers above and click Reset</p>
            </div>`;
        }

        function updateComparisonEmpty() {
            leftCompareDiv.innerText = "-";
            rightCompareDiv.innerText = "-";
            compareTextSpan.innerText = "Enter numbers to begin";
        }

        function updateStatsAndUI() {
            passSpan.innerText = currentPass;
            comparisonsSpan.innerText = comparisons;
            swapsSpan.innerText = swaps;
        }

        function renderBars(arr, compareIndices = null, swapIndices = null) {
            if (!arr || arr.length === 0) {
                renderEmptyMessage();
                return;
            }
            barsContainer.innerHTML = "";
            const maxVal = Math.max(...arr);
            const minBarHeight = 40;
            const maxBarHeight = 320;
            for (let i = 0; i < arr.length; i++) {
                let val = arr[i];
                let heightRatio = maxVal === 0 ? 0 : val / maxVal;
                let barHeight = minBarHeight + heightRatio * maxBarHeight;
                if (maxVal === 0) barHeight = 60;
                let wrapper = document.createElement("div");
                wrapper.className = "bar-wrapper";
                let bar = document.createElement("div");
                bar.className = "bar";
                bar.style.height = barHeight + "px";
                bar.style.width = "55px";

                if (compareIndices && (i === compareIndices[0] || i === compareIndices[1])) {
                    bar.classList.add("comparing");
                }
                if (swapIndices && (i === swapIndices[0] || i === swapIndices[1])) {
                    bar.classList.add("swapping");
                }
                if (steps[stepIndex] && steps[stepIndex].passCount > 0 && arr.length > 0) {
                    let passCountVal = steps[stepIndex].passCount;
                    let sortedFrom = arr.length - passCountVal;
                    if (i >= sortedFrom && passCountVal > 0 && i >= 1) {
                        bar.classList.add("sorted");
                    }
                }
                if (stepIndex === steps.length - 1 && steps[stepIndex] && steps[stepIndex].explanation.includes("sorted")) {
                    bar.classList.add("sorted");
                }

                let numberSpan = document.createElement("div");
                numberSpan.className = "bar-number";
                numberSpan.innerText = val;
                wrapper.appendChild(bar);
                wrapper.appendChild(numberSpan);
                barsContainer.appendChild(wrapper);
            }
        }

        function updateComparisonPanel(stepData) {
            if (!stepData.compareIndices) {
                leftCompareDiv.innerText = "-";
                rightCompareDiv.innerText = "-";
                if (stepData.explanation.includes("No elements")) {
                    compareTextSpan.innerText = "⚠️ " + stepData.explanation;
                } else if (stepData.explanation.includes("sorted") || stepData.explanation.includes("Initial")) {
                    compareTextSpan.innerText = stepData.explanation;
                } else {
                    compareTextSpan.innerText = "No active comparison";
                }
                return;
            }
            let [idxA, idxB] = stepData.compareIndices;
            let arrCurr = stepData.array;
            if (arrCurr && idxA !== undefined && idxB !== undefined && idxA < arrCurr.length && idxB < arrCurr.length) {
                leftCompareDiv.innerText = arrCurr[idxA];
                rightCompareDiv.innerText = arrCurr[idxB];
                if (stepData.swapOccurred) {
                    compareTextSpan.innerHTML = `<i class="fa-solid fa-arrow-right-arrow-left"></i> SWAP! ${arrCurr[idxA]} ↔ ${arrCurr[idxB]}`;
                } else {
                    compareTextSpan.innerHTML = `🔍 Compare ${arrCurr[idxA]} and ${arrCurr[idxB]}`;
                }
            } else {
                leftCompareDiv.innerText = "-";
                rightCompareDiv.innerText = "-";
                compareTextSpan.innerText = stepData.explanation;
            }
        }

        // NO TIMESTAMPS - just the explanation message
        function addLogMessage(message) {
            let logItem = document.createElement("div");
            logItem.className = "log-item";
            logItem.innerHTML = `📌 ${message}`;
            logBox.prepend(logItem);
            if (logBox.children.length > 30) {
                logBox.removeChild(logBox.lastChild);
            }
        }

        function applyStep(index) {
            if (index < 0 || index >= steps.length) return false;
            stepIndex = index;
            let step = steps[stepIndex];
            if (step.array.length === 0) {
                renderEmptyMessage();
                updateComparisonEmpty();
                updateStatsAndUI();
                addLogMessage(step.explanation);
                statusSpan.innerText = "No Data";
                return true;
            }
            array = [...step.array];
            comparisons = step.comparisonsCount;
            swaps = step.swapsCount;
            currentPass = step.passCount;
            updateStatsAndUI();
            let compareIdx = step.compareIndices ? step.compareIndices : null;
            let swapFlag = step.swapOccurred ? step.compareIndices : null;
            renderBars(array, compareIdx, swapFlag);
            updateComparisonPanel(step);
            addLogMessage(step.explanation);
            if (stepIndex === steps.length - 1 && step.array.length > 0) {
                statusSpan.innerText = "Completed!";
                if (interval) {
                    clearInterval(interval);
                    interval = null;
                    isPlaying = false;
                }
            } else {
                statusSpan.innerText = isPlaying ? "Playing..." : "Paused";
            }
            return true;
        }

        function nextStep() {
            if (interval) pauseSort();
            if (steps.length === 0) {
                resetArray();
                return;
            }
            if (stepIndex + 1 < steps.length) {
                applyStep(stepIndex + 1);
            } else {
                if (steps.length > 0 && stepIndex === steps.length - 1 && steps[stepIndex].array.length > 0) {
                    addLogMessage("Already at final sorted state.");
                    statusSpan.innerText = "Completed";
                } else if (steps[stepIndex] && steps[stepIndex].array.length === 0) {
                    addLogMessage("Please enter numbers first.");
                }
            }
            enableControls(true);
        }

        function prevStep() {
            if (interval) pauseSort();
            if (stepIndex - 1 >= 0) {
                applyStep(stepIndex - 1);
            } else {
                addLogMessage("Already at the first step.");
            }
        }

        function startSort() {
            if (steps.length === 0 || (steps[0] && steps[0].array.length === 0)) {
                addLogMessage("Cannot start: No array data. Please enter space-separated numbers and click Reset.");
                return;
            }
            if (interval) clearInterval(interval);
            if (stepIndex >= steps.length - 1) {
                resetArray();
            }
            if (isPlaying) return;
            isPlaying = true;
            statusSpan.innerText = "Playing...";
            interval = setInterval(() => {
                if (stepIndex + 1 < steps.length) {
                    applyStep(stepIndex + 1);
                } else {
                    clearInterval(interval);
                    interval = null;
                    isPlaying = false;
                    statusSpan.innerText = "Completed";
                    addLogMessage("Sorting finished!");
                }
            }, delay);
        }

        function pauseSort() {
            if (interval) {
                clearInterval(interval);
                interval = null;
            }
            isPlaying = false;
            statusSpan.innerText = "Paused";
        }

        function resetArray() {
            if (interval) {
                clearInterval(interval);
                interval = null;
                isPlaying = false;
            }
            loadNewArray();
        }

        function enableControls(enable) {
            const btns = [startBtn, pauseBtn, resetBtn, nextBtn, backBtn];
            btns.forEach(btn => {
                if (btn) btn.disabled = !enable;
            });
            if (enable) {
                startBtn.disabled = false;
                pauseBtn.disabled = false;
                resetBtn.disabled = false;
                nextBtn.disabled = false;
                backBtn.disabled = false;
            }
        }

        function updateDelay() {
            let val = parseInt(speedSlider.value);
            let percent = Math.floor(((1500 - val) / 1400) * 100);
            speedValueSpan.innerText = percent;
            delay = val;
            if (interval) {
                let wasPlaying = isPlaying;
                if (wasPlaying) {
                    clearInterval(interval);
                    interval = setInterval(() => {
                        if (stepIndex + 1 < steps.length) applyStep(stepIndex + 1);
                        else {
                            clearInterval(interval);
                            interval = null;
                            isPlaying = false;
                            statusSpan.innerText = "Completed";
                        }
                    }, delay);
                }
            }
        }

        speedSlider.addEventListener("input", updateDelay);
        window.addEventListener("load", () => {
            updateDelay();
            loadNewArray();
        });

        arrayInput.addEventListener("change", () => {
            if (interval) clearInterval(interval);
            isPlaying = false;
            resetArray();
        });

        window.startSort = startSort;
        window.pauseSort = pauseSort;
        window.resetArray = resetArray;
        window.nextStep = nextStep;
        window.prevStep = prevStep;

        setTimeout(() => {
            addLogMessage("✨ Enter space-separated numbers in the input field and click Reset to visualize Optimized Bubble Sort!");
        }, 100);
    </script>
</body>

</html>
