<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Insertion Sort Visualizer | Space Separated Input</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Arial, Helvetica, sans-serif;
            background: #0f172a;
            color: white;
            min-height: 100vh;
            padding: 25px;
        }
        
        .header {
            text-align: center;
            margin-bottom: 25px;
        }
        
        .header h1 {
            font-size: 42px;
            color: #a78bfa;
            margin-bottom: 10px;
        }
        
        .header p {
            color: #cbd5e1;
            font-size: 17px;
        }
        
        .main-layout {
            display: flex;
            gap: 25px;
            align-items: flex-start;
        }
        
        .left-panel {
            flex: 1;
        }
        
        .control-panel {
            background: #1e293b;
            border-radius: 18px;
            padding: 22px;
            margin-bottom: 25px;
            border: 1px solid #334155;
        }
        
        .input-section {
            margin-bottom: 20px;
        }
        
        .input-section label {
            display: block;
            margin-bottom: 8px;
            color: #cbd5e1;
            font-size: 14px;
        }
        
        .input-section input {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 12px;
            background: #334155;
            color: white;
            font-size: 16px;
        }
        
        .input-section input:focus {
            outline: none;
            border: 2px solid #38bdf8;
        }
        
        .input-section .hint {
            font-size: 12px;
            color: #94a3b8;
            margin-top: 6px;
        }
        
        button {
            border: none;
            padding: 13px 20px;
            border-radius: 12px;
            color: white;
            cursor: pointer;
            font-size: 15px;
            font-weight: bold;
            transition: 0.3s;
            background: #38bdf8;
            box-shadow: 0 2px 8px rgba(56, 189, 248, 0.3);
        }
        
        button:hover {
            transform: translateY(-2px);
            background: #0ea5e9;
            box-shadow: 0 4px 12px rgba(56, 189, 248, 0.5);
        }
        
        button i {
            margin-right: 8px;
        }
        
        button:disabled {
            opacity: .5;
            cursor: not-allowed;
            background: #7aa2b8;
            transform: none;
        }
        
        .start-btn,
        .pause-btn,
        .reset-btn,
        .next-btn,
        .back-btn {
            background: #38bdf8;
        }
        
        .start-btn:hover,
        .pause-btn:hover,
        .reset-btn:hover,
        .next-btn:hover,
        .back-btn:hover {
            background: #0ea5e9;
        }
        
        .speed-box {
            margin-top: 10px;
        }
        
        .speed-box label {
            display: block;
            margin-bottom: 10px;
            color: #cbd5e1;
            font-size: 15px;
        }
        
        .speed-box input {
            width: 100%;
        }
        
        .compare-box {
            background: #111827;
            border: 2px solid #334155;
            border-radius: 18px;
            padding: 25px;
            margin-bottom: 25px;
        }
        
        .compare-title {
            font-size: 24px;
            margin-bottom: 20px;
            color: #a78bfa;
        }
        
        .compare-content {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 25px;
            flex-wrap: wrap;
        }
        
        .number-card {
            width: 100px;
            height: 100px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 34px;
            font-weight: bold;
            border-radius: 18px;
            transition: 0.3s;
        }
        
        .left-number {
            background: #f59e0b;
        }
        
        .right-number {
            background: #ef4444;
        }
        
        .arrow {
            font-size: 35px;
            color: #38bdf8;
        }
        
        .compare-result {
            margin-top: 20px;
            text-align: center;
            font-size: 26px;
            font-weight: bold;
            color: #facc15;
        }
        
        .visualizer {
            background: #111827;
            border-radius: 18px;
            padding: 25px;
            border: 1px solid #334155;
            overflow-x: auto;
        }
        
        #bars {
            height: 420px;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            gap: 14px;
            min-width: max-content;
        }
        
        .bar-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        .bar {
            width: 55px;
            border-radius: 12px 12px 0 0;
            background: #38bdf8;
            transition: 0.4s;
        }
        
        .bar-number {
            margin-top: 12px;
            font-size: 18px;
            font-weight: bold;
            color: white;
        }
        
        .comparing {
            background: #facc15 !important;
        }
        
        .swapping {
            background: #ef4444 !important;
        }
        
        .sorted {
            background: #22c55e !important;
        }
        
        .current-element {
            background: #c084fc !important;
            box-shadow: 0 0 0 3px #a78bfa;
        }
        
        .right-panel {
            width: 380px;
            background: #111827;
            border-radius: 18px;
            border: 1px solid #334155;
            padding: 22px;
            position: sticky;
            top: 20px;
        }
        
        .right-panel h2 {
            color: #a78bfa;
            margin-bottom: 20px;
            font-size: 28px;
        }
        
        .stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
            margin-bottom: 25px;
        }
        
        .stat-box {
            background: #1e293b;
            padding: 18px;
            border-radius: 14px;
            text-align: center;
        }
        
        .stat-title {
            color: #cbd5e1;
            margin-bottom: 8px;
        }
        
        .stat-value {
            font-size: 28px;
            font-weight: bold;
            color: #38bdf8;
        }
        
        .log-title {
            font-size: 22px;
            margin-bottom: 15px;
            color: #38bdf8;
        }
        
        .log-box {
            background: #1e293b;
            border-radius: 14px;
            padding: 15px;
            height: 500px;
            overflow-y: auto;
        }
        
        .log-item {
            background: #334155;
            padding: 14px;
            border-radius: 10px;
            margin-bottom: 12px;
            line-height: 1.7;
            font-size: 15px;
            border-left: 4px solid #38bdf8;
        }
        
        .floating-controls {
            position: fixed;
            right: 20px;
            bottom: 20px;
            display: flex;
            gap: 10px;
            background: rgba(30, 41, 59, .95);
            padding: 12px;
            border-radius: 16px;
            border: 1px solid #334155;
            backdrop-filter: blur(10px);
            z-index: 9999;
        }
        
        .floating-controls button {
            width: 50px;
            height: 50px;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #38bdf8;
        }
        
        .floating-controls button i {
            margin: 0;
        }
        
        @media(max-width:1200px) {
            .main-layout {
                flex-direction: column;
            }
            .right-panel {
                width: 100%;
                position: relative;
            }
        }
    </style>
</head>

<body>

    <div class="header">
        <h1>Insertion Sort Visualizer</h1>
        <p>Learn how Insertion Sort builds the sorted array one element at a time</p>
    </div>

    <div class="main-layout">
        <div class="left-panel">
            <div class="control-panel">
                <div class="input-section">
                    <label><i class="fa-solid fa-keyboard"></i> Enter Numbers (space separated)</label>
                    <input type="text" id="arrayInput" placeholder="Example: 5 3 8 1 9 2" value="">
                    <div class="hint"><i class="fa-regular fa-lightbulb"></i> Type numbers separated by spaces, then press Enter or click Reset</div>
                </div>
                <div class="buttons">
                    <button id="startBtn" class="start-btn" onclick="startSort()">
                    <i class="fa-solid fa-play"></i> Start
                </button>
                    <button id="pauseBtn" class="pause-btn" onclick="pauseSort()">
                    <i class="fa-solid fa-pause"></i> Pause
                </button>
                    <button id="resetBtn" class="reset-btn" onclick="resetArray()">
                    <i class="fa-solid fa-rotate-left"></i> Reset
                </button>
                    <button id="nextBtn" class="next-btn" onclick="nextStep()">
                    <i class="fa-solid fa-forward-step"></i> Next
                </button>
                    <button id="backBtn" class="back-btn" onclick="prevStep()">
                    <i class="fa-solid fa-backward-step"></i> Back
                </button>
                </div>
                <div class="speed-box">
                    <label>
                    <i class="fa-solid fa-gauge-high"></i> Animation Speed :
                    <span id="speedValue">27</span>%
                </label>
                    <input type="range" id="speed" min="100" max="1500" value="500">
                </div>
            </div>

            <div class="compare-box">
                <div class="compare-title"><i class="fa-solid fa-hand-back-fist"></i> Current Operation</div>
                <div class="compare-content">
                    <div class="number-card left-number" id="leftCompare">-</div>
                    <div class="arrow">→</div>
                    <div class="number-card right-number" id="rightCompare">-</div>
                </div>
                <div class="compare-result" id="compareText">
                    Waiting...
                </div>
            </div>

            <div class="visualizer">
                <div id="bars"></div>
            </div>
        </div>

        <div class="right-panel">
            <h2><i class="fa-solid fa-chart-line"></i> Sorting Information</h2>
            <div class="stats">
                <div class="stat-box">
                    <div class="stat-title"><i class="fa-solid fa-layer-group"></i> Iteration</div>
                    <div class="stat-value" id="pass">0</div>
                </div>
                <div class="stat-box">
                    <div class="stat-title"><i class="fa-solid fa-eye"></i> Comparisons</div>
                    <div class="stat-value" id="comparisons">0</div>
                </div>
                <div class="stat-box">
                    <div class="stat-title"><i class="fa-solid fa-arrows-spin"></i> Shifts/Swaps</div>
                    <div class="stat-value" id="swaps">0</div>
                </div>
                <div class="stat-box">
                    <div class="stat-title"><i class="fa-solid fa-microchip"></i> Status</div>
                    <div class="stat-value" id="status">Ready</div>
                </div>
            </div>
            <div class="log-title"><i class="fa-solid fa-list-check"></i> Step Explanation</div>
            <div class="log-box" id="logBox"></div>
        </div>
    </div>

    <div class="floating-controls">
        <button class="start-btn" onclick="startSort()"><i class="fa-solid fa-play"></i></button>
        <button class="pause-btn" onclick="pauseSort()"><i class="fa-solid fa-pause"></i></button>
        <button class="back-btn" onclick="prevStep()"><i class="fa-solid fa-backward-step"></i></button>
        <button class="next-btn" onclick="nextStep()"><i class="fa-solid fa-forward-step"></i></button>
        <button class="reset-btn" onclick="resetArray()"><i class="fa-solid fa-rotate-left"></i></button>
    </div>

    <script>
        // ------------------- INSERTION SORT VISUALIZER ------------------
        let array = [];
        let steps = [];
        let stepIndex = -1;
        let interval = null;
        let isPlaying = false;

        let comparisons = 0;
        let shifts = 0; // shifts/swaps count
        let currentIteration = 0;

        let delay = 500;

        const barsContainer = document.getElementById("bars");
        const arrayInput = document.getElementById("arrayInput");
        const startBtn = document.getElementById("startBtn");
        const pauseBtn = document.getElementById("pauseBtn");
        const resetBtn = document.getElementById("resetBtn");
        const nextBtn = document.getElementById("nextBtn");
        const backBtn = document.getElementById("backBtn");
        const speedSlider = document.getElementById("speed");
        const speedValueSpan = document.getElementById("speedValue");

        const passSpan = document.getElementById("pass");
        const comparisonsSpan = document.getElementById("comparisons");
        const swapsSpan = document.getElementById("swaps");
        const statusSpan = document.getElementById("status");
        const logBox = document.getElementById("logBox");
        const leftCompareDiv = document.getElementById("leftCompare");
        const rightCompareDiv = document.getElementById("rightCompare");
        const compareTextSpan = document.getElementById("compareText");

        // Parse space-separated numbers
        function parseArrayFromInput() {
            let raw = arrayInput.value.trim();
            if (raw === "") return [];
            let parts = raw.split(/\s+/);
            let arr = [];
            for (let p of parts) {
                let num = parseInt(p, 10);
                if (!isNaN(num)) arr.push(num);
            }
            return arr;
        }

        // Generate all insertion sort steps
        function generateStepsFromArray(arr) {
            if (!arr || arr.length === 0) {
                return [{
                    array: [],
                    comparisonsCount: 0,
                    shiftsCount: 0,
                    iteration: 0,
                    currentIndex: null,
                    compareIndices: null,
                    explanation: "No elements to sort. Please enter numbers separated by spaces."
                }];
            }

            let working = [...arr];
            let stepRecorder = [];
            let totalComparisons = 0;
            let totalShifts = 0;
            let iteration = 0;
            let n = working.length;

            // Initial state
            stepRecorder.push({
                array: [...working],
                comparisonsCount: totalComparisons,
                shiftsCount: totalShifts,
                iteration: iteration,
                currentIndex: null,
                compareIndices: null,
                explanation: `Initial array: [${working.join(', ')}]. Insertion Sort starts from index 1.`
            });

            // Insertion sort algorithm with detailed steps
            for (let i = 1; i < n; i++) {
                let key = working[i];
                let j = i - 1;
                iteration = i;

                // Show picking the key element
                stepRecorder.push({
                    array: [...working],
                    comparisonsCount: totalComparisons,
                    shiftsCount: totalShifts,
                    iteration: iteration,
                    currentIndex: i,
                    compareIndices: null,
                    explanation: `Pick element at index ${i}: value = ${key}. This is the current element to insert into the sorted portion [0..${i-1}].`
                });

                // Compare and shift steps
                let shifted = false;
                while (j >= 0 && working[j] > key) {
                    // Comparison step
                    totalComparisons++;
                    stepRecorder.push({
                        array: [...working],
                        comparisonsCount: totalComparisons,
                        shiftsCount: totalShifts,
                        iteration: iteration,
                        currentIndex: i,
                        compareIndices: [j, j + 1],
                        explanation: `Comparing ${working[j]} (at index ${j}) with key ${key}. ${working[j]} > ${key}, need to shift right.`
                    });

                    // Perform shift
                    working[j + 1] = working[j];
                    totalShifts++;
                    shifted = true;
                    stepRecorder.push({
                        array: [...working],
                        comparisonsCount: totalComparisons,
                        shiftsCount: totalShifts,
                        iteration: iteration,
                        currentIndex: i,
                        compareIndices: [j, j + 1],
                        explanation: `Shift: Move ${working[j+1]} from index ${j} to index ${j+1}.`
                    });
                    j--;
                }

                // Final comparison if loop ends (or no shift case)
                if (j >= 0) {
                    totalComparisons++;
                    stepRecorder.push({
                        array: [...working],
                        comparisonsCount: totalComparisons,
                        shiftsCount: totalShifts,
                        iteration: iteration,
                        currentIndex: i,
                        compareIndices: [j, j + 1],
                        explanation: `Comparing ${working[j]} (at index ${j}) with key ${key}. ${working[j]} ≤ ${key}, stop shifting.`
                    });
                }

                // Place the key
                working[j + 1] = key;
                stepRecorder.push({
                    array: [...working],
                    comparisonsCount: totalComparisons,
                    shiftsCount: totalShifts,
                    iteration: iteration,
                    currentIndex: null,
                    compareIndices: null,
                    explanation: `Insert key ${key} at position ${j+1}. Sorted portion is now [${working.slice(0, i+1).join(', ')}].`
                });
            }

            // Final sorted state
            stepRecorder.push({
                array: [...working],
                comparisonsCount: totalComparisons,
                shiftsCount: totalShifts,
                iteration: n - 1,
                currentIndex: null,
                compareIndices: null,
                explanation: `🏁 Array fully sorted! Final result: [${working.join(', ')}]. Insertion Sort finished.`
            });

            return stepRecorder;
        }

        function loadNewArray() {
            if (interval) {
                clearInterval(interval);
                interval = null;
                isPlaying = false;
            }
            let newArr = parseArrayFromInput();

            if (newArr.length === 0) {
                array = [];
                steps = generateStepsFromArray([]);
                stepIndex = 0;
                comparisons = 0;
                shifts = 0;
                currentIteration = 0;
                updateStatsAndUI();
                renderEmptyMessage();
                updateComparisonEmpty();
                addLogMessage("⚠️ No numbers entered. Please enter space-separated numbers (e.g., '5 3 8 1 9') and click Reset.");
                statusSpan.innerText = "No Data";
                enableControls(true);
                return;
            }

            array = [...newArr];
            steps = generateStepsFromArray(array);
            stepIndex = 0;
            comparisons = steps[0].comparisonsCount;
            shifts = steps[0].shiftsCount;
            currentIteration = steps[0].iteration;
            updateStatsAndUI();
            renderBars(steps[0].array, steps[0].currentIndex, steps[0].compareIndices);
            updateComparisonPanel(steps[0]);
            addLogMessage(steps[0].explanation);
            statusSpan.innerText = "Ready";
            enableControls(true);
        }

        function renderEmptyMessage() {
            barsContainer.innerHTML = `<div style="display:flex; justify-content:center; align-items:center; height:420px; width:100%; color:#cbd5e1; flex-direction:column; gap:15px;">
            <i class="fa-solid fa-chart-simple" style="font-size:48px; color:#38bdf8;"></i>
            <p style="font-size:18px;">No numbers to display</p>
            <p style="font-size:14px;">Enter space-separated numbers above and click Reset</p>
            </div>`;
        }

        function updateComparisonEmpty() {
            leftCompareDiv.innerText = "-";
            rightCompareDiv.innerText = "-";
            compareTextSpan.innerText = "Enter numbers to begin";
        }

        function updateStatsAndUI() {
            passSpan.innerText = currentIteration;
            comparisonsSpan.innerText = comparisons;
            swapsSpan.innerText = shifts;
        }

        function renderBars(arr, currentIdx = null, compareIndices = null) {
            if (!arr || arr.length === 0) {
                renderEmptyMessage();
                return;
            }
            barsContainer.innerHTML = "";
            const maxVal = Math.max(...arr);
            const minBarHeight = 40;
            const maxBarHeight = 320;

            for (let i = 0; i < arr.length; i++) {
                let val = arr[i];
                let heightRatio = maxVal === 0 ? 0 : val / maxVal;
                let barHeight = minBarHeight + heightRatio * maxBarHeight;
                if (maxVal === 0) barHeight = 60;

                let wrapper = document.createElement("div");
                wrapper.className = "bar-wrapper";
                let bar = document.createElement("div");
                bar.className = "bar";
                bar.style.height = barHeight + "px";
                bar.style.width = "55px";

                // Highlight current key element (purple)
                if (currentIdx !== null && i === currentIdx) {
                    bar.classList.add("current-element");
                }
                // Highlight comparison pair
                if (compareIndices && (i === compareIndices[0] || i === compareIndices[1])) {
                    bar.classList.add("comparing");
                }
                // Mark sorted portion (indices less than current iteration are sorted)
                if (currentIteration > 0 && i < currentIteration && currentIdx !== i) {
                    bar.classList.add("sorted");
                }
                // Final all sorted
                if (stepIndex === steps.length - 1 && steps[stepIndex] && steps[stepIndex].explanation.includes("sorted")) {
                    bar.classList.add("sorted");
                }

                let numberSpan = document.createElement("div");
                numberSpan.className = "bar-number";
                numberSpan.innerText = val;
                wrapper.appendChild(bar);
                wrapper.appendChild(numberSpan);
                barsContainer.appendChild(wrapper);
            }
        }

        function updateComparisonPanel(stepData) {
            if (stepData.compareIndices) {
                let [idxA, idxB] = stepData.compareIndices;
                let arrCurr = stepData.array;
                if (arrCurr && idxA !== undefined && idxB !== undefined && idxA < arrCurr.length && idxB < arrCurr.length) {
                    leftCompareDiv.innerText = arrCurr[idxA];
                    rightCompareDiv.innerText = arrCurr[idxB];
                    compareTextSpan.innerHTML = `🔍 Comparing ${arrCurr[idxA]} and ${arrCurr[idxB]}`;
                    return;
                }
            }

            if (stepData.currentIndex !== null && !stepData.compareIndices) {
                let keyVal = stepData.array[stepData.currentIndex];
                leftCompareDiv.innerText = keyVal;
                rightCompareDiv.innerText = "← insert";
                compareTextSpan.innerHTML = `🎯 Current key: ${keyVal} - finding correct position`;
                return;
            }

            if (stepData.explanation.includes("Insert") || stepData.explanation.includes("sorted") || stepData.explanation.includes("Initial")) {
                leftCompareDiv.innerText = "-";
                rightCompareDiv.innerText = "-";
                compareTextSpan.innerText = stepData.explanation;
                return;
            }

            leftCompareDiv.innerText = "-";
            rightCompareDiv.innerText = "-";
            compareTextSpan.innerText = stepData.explanation;
        }

        // NO TIMESTAMPS - just the explanation message
        function addLogMessage(message) {
            let logItem = document.createElement("div");
            logItem.className = "log-item";
            logItem.innerHTML = `📌 ${message}`;
            logBox.prepend(logItem);
            if (logBox.children.length > 30) {
                logBox.removeChild(logBox.lastChild);
            }
        }

        function applyStep(index) {
            if (index < 0 || index >= steps.length) return false;
            stepIndex = index;
            let step = steps[stepIndex];

            if (step.array.length === 0) {
                renderEmptyMessage();
                updateComparisonEmpty();
                updateStatsAndUI();
                addLogMessage(step.explanation);
                statusSpan.innerText = "No Data";
                return true;
            }

            array = [...step.array];
            comparisons = step.comparisonsCount;
            shifts = step.shiftsCount;
            currentIteration = step.iteration;
            updateStatsAndUI();
            renderBars(array, step.currentIndex, step.compareIndices);
            updateComparisonPanel(step);
            addLogMessage(step.explanation);

            if (stepIndex === steps.length - 1) {
                statusSpan.innerText = "Completed!";
                if (interval) {
                    clearInterval(interval);
                    interval = null;
                    isPlaying = false;
                }
            } else {
                statusSpan.innerText = isPlaying ? "Playing..." : "Paused";
            }
            return true;
        }

        function nextStep() {
            if (interval) pauseSort();
            if (steps.length === 0) {
                resetArray();
                return;
            }
            if (stepIndex + 1 < steps.length) {
                applyStep(stepIndex + 1);
            } else {
                if (steps.length > 0 && stepIndex === steps.length - 1 && steps[stepIndex].array.length > 0) {
                    addLogMessage("Already at final sorted state.");
                    statusSpan.innerText = "Completed";
                } else if (steps[stepIndex] && steps[stepIndex].array.length === 0) {
                    addLogMessage("Please enter numbers first.");
                }
            }
            enableControls(true);
        }

        function prevStep() {
            if (interval) pauseSort();
            if (stepIndex - 1 >= 0) {
                applyStep(stepIndex - 1);
            } else {
                addLogMessage("Already at the first step.");
            }
        }

        function startSort() {
            if (steps.length === 0 || (steps[0] && steps[0].array.length === 0)) {
                addLogMessage("Cannot start: No array data. Please enter space-separated numbers and click Reset.");
                return;
            }
            if (interval) clearInterval(interval);
            if (stepIndex >= steps.length - 1) {
                resetArray();
            }
            if (isPlaying) return;
            isPlaying = true;
            statusSpan.innerText = "Playing...";
            interval = setInterval(() => {
                if (stepIndex + 1 < steps.length) {
                    applyStep(stepIndex + 1);
                } else {
                    clearInterval(interval);
                    interval = null;
                    isPlaying = false;
                    statusSpan.innerText = "Completed";
                    addLogMessage("Sorting finished!");
                }
            }, delay);
        }

        function pauseSort() {
            if (interval) {
                clearInterval(interval);
                interval = null;
            }
            isPlaying = false;
            statusSpan.innerText = "Paused";
        }

        function resetArray() {
            if (interval) {
                clearInterval(interval);
                interval = null;
                isPlaying = false;
            }
            loadNewArray();
        }

        function enableControls(enable) {
            const btns = [startBtn, pauseBtn, resetBtn, nextBtn, backBtn];
            btns.forEach(btn => {
                if (btn) btn.disabled = !enable;
            });
            if (enable) {
                startBtn.disabled = false;
                pauseBtn.disabled = false;
                resetBtn.disabled = false;
                nextBtn.disabled = false;
                backBtn.disabled = false;
            }
        }

        function updateDelay() {
            let val = parseInt(speedSlider.value);
            let percent = Math.floor(((1500 - val) / 1400) * 100);
            speedValueSpan.innerText = percent;
            delay = val;
            if (interval) {
                let wasPlaying = isPlaying;
                if (wasPlaying) {
                    clearInterval(interval);
                    interval = setInterval(() => {
                        if (stepIndex + 1 < steps.length) applyStep(stepIndex + 1);
                        else {
                            clearInterval(interval);
                            interval = null;
                            isPlaying = false;
                            statusSpan.innerText = "Completed";
                        }
                    }, delay);
                }
            }
        }

        speedSlider.addEventListener("input", updateDelay);
        window.addEventListener("load", () => {
            updateDelay();
            loadNewArray();
        });

        arrayInput.addEventListener("change", () => {
            if (interval) clearInterval(interval);
            isPlaying = false;
            resetArray();
        });

        window.startSort = startSort;
        window.pauseSort = pauseSort;
        window.resetArray = resetArray;
        window.nextStep = nextStep;
        window.prevStep = prevStep;

        setTimeout(() => {
            addLogMessage("✨ Insertion Sort: Builds sorted array by inserting one element at a time. Enter numbers and click Reset!");
        }, 100);
    </script>
</body>

</html>
